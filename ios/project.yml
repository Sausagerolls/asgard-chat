name: AsgardChat
options:
  bundleIdPrefix: com.giantmushroom
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  AsgardKit:
    path: Packages/AsgardKit
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.19.0
settings:
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
targets:
  AsgardChat:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: SharedUI
    dependencies:
      - package: AsgardKit
      - package: LiveKit
      - target: AsgardNotificationService
      - target: AsgardWidgets
      - target: AsgardShare
    entitlements:
      path: App/AsgardChat.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.giantmushroom.asgardchat]
        keychain-access-groups: [$(AppIdentifierPrefix)com.giantmushroom.asgardchat.shared]
        com.apple.developer.associated-domains: [applinks:chat.giantmushroom.studio, webcredentials:chat.giantmushroom.studio]
        com.apple.developer.siri: true
        com.apple.developer.usernotifications.communication: true
        com.apple.developer.usernotifications.time-sensitive: true
        # "CarPlay Communication" (not Audio), granted by Apple on 2026-10-28.
        com.apple.developer.carplay-communication: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Asgard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.social-networking
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification, voip, audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.giantmushroom.asgardchat.sync]
        NSUserActivityTypes: [INSendMessageIntent, INStartCallIntent, INSearchForMessagesIntent, OpenConversationIntent, SendMessageIntent]
        INIntentsSupported: [INSendMessageIntent, INStartCallIntent, INSearchForMessagesIntent, INSetMessageAttributeIntent]
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Asgard uses the camera for photos, video messages, video calls and scanning device-link QR codes.
        NSMicrophoneUsageDescription: Asgard uses the microphone for voice messages and calls.
        NSPhotoLibraryUsageDescription: Choose photos and videos to send.
        NSPhotoLibraryAddUsageDescription: Save photos and videos you receive.
        NSLocationWhenInUseUsageDescription: Share your location in a chat when you choose to.
        NSContactsUsageDescription: Share a contact card in a chat.
        NSFaceIDUsageDescription: Lock Asgard and individual chats with Face ID.
        NSSiriUsageDescription: Send and read Asgard messages with Siri, including in CarPlay.
        NSLocalNetworkUsageDescription: Connect to an Asgard server on your home network.
        CFBundleURLTypes:
          - CFBundleURLName: com.giantmushroom.asgardchat
            CFBundleURLSchemes: [asgard]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASGARD_BUNDLE_ID)
        PRODUCT_NAME: AsgardChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: ""

  AsgardMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: App/Theme
      - path: SharedUI
    dependencies:
      - package: AsgardKit
      - package: LiveKit
    entitlements:
      path: Mac/AsgardMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.developer.aps-environment: development
        com.apple.security.application-groups: [group.com.giantmushroom.asgardchat]
        keychain-access-groups: [$(AppIdentifierPrefix)com.giantmushroom.asgardchat.shared]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Asgard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: Share video in calls and voice rooms.
        NSMicrophoneUsageDescription: Talk in calls and voice rooms, and record voice messages.
        NSLocalNetworkUsageDescription: Connect to an Asgard server on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.giantmushroom.asgardchat
            CFBundleURLSchemes: [asgard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASGARD_BUNDLE_ID)
        PRODUCT_NAME: Asgard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES

  AsgardNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: AsgardKit
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.com.giantmushroom.asgardchat]
        keychain-access-groups: [$(AppIdentifierPrefix)com.giantmushroom.asgardchat.shared]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Asgard Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSUserActivityTypes: [INSendMessageIntent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASGARD_BUNDLE_ID).notify
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  AsgardWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: AsgardKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.giantmushroom.asgardchat]
        keychain-access-groups: [$(AppIdentifierPrefix)com.giantmushroom.asgardchat.shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Asgard Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASGARD_BUNDLE_ID).widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AsgardShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
    dependencies:
      - package: AsgardKit
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.giantmushroom.asgardchat]
        keychain-access-groups: [$(AppIdentifierPrefix)com.giantmushroom.asgardchat.shared]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Asgard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
            IntentsSupported: [INSendMessageIntent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASGARD_BUNDLE_ID).share

  AsgardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AsgardChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASGARD_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  AsgardChat:
    build:
      targets:
        AsgardChat: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [AsgardUITests]
    archive:
      config: Release
  AsgardMac:
    build:
      targets:
        AsgardMac: all
    run:
      config: Debug
    archive:
      config: Release
