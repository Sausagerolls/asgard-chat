# Unraid (or any host that already has a reverse proxy such as Nginx Proxy Manager).
#   docker compose -f docker-compose.yml -f docker-compose.unraid.yml up -d --build
#
# - No Caddy: your existing proxy terminates HTTPS and forwards to port 8080
#   (Asgard) and 7880 (LiveKit). Both need WebSocket support turned on.
# - Data lives under APPDATA (bind mounts), not in docker.img, so it survives
#   Docker image rebuilds and is included in Unraid appdata backups.
# - LiveKit uses host networking so calls advertise the server's real address.
#
# Set in .env:
#   APPDATA=/mnt/cache/appdata/asgard
#   ASGARD_PUBLIC_URL=https://chat.example.com      (or http://192.168.1.10:8080 on a LAN)
#   ASGARD_LIVEKIT_URL=wss://rtc.chat.example.com   (or ws://192.168.1.10:7880 on a LAN)
# Private network only (Tailscale/LAN), no port forwarding:
#   LIVEKIT_CONFIG=livekit.private.yaml
#   LIVEKIT_NODE_IP=100.x.y.z                        (this server's Tailscale IP)
services:
  caddy:
    profiles: ["caddy"] # not started on Unraid

  asgard:
    ports: ["${ASGARD_HTTP_PORT:-8080}:8080"]
    environment:
      ASGARD_PUBLIC_URL: ${ASGARD_PUBLIC_URL}
      ASGARD_LIVEKIT_URL: ${ASGARD_LIVEKIT_URL}
    volumes:
      - ${APPDATA:-/mnt/cache/appdata/asgard}/data:/data

  postgres:
    volumes:
      - ${APPDATA:-/mnt/cache/appdata/asgard}/postgres:/var/lib/postgresql/data

  livekit:
    network_mode: host
    ports: !reset []
    # With LIVEKIT_NODE_IP set (e.g. your Tailscale IP), calls use that address
    # instead of your public IP; no router port forwarding needed.
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-}"]
    volumes:
      - ./${LIVEKIT_CONFIG:-livekit.yaml}:/etc/livekit.yaml:ro

  backup:
    volumes:
      - ${APPDATA:-/mnt/cache/appdata/asgard}/data:/media:ro
      - ${APPDATA:-/mnt/cache/appdata/asgard}/backups:/backups
